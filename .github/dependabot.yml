version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Version updates cover only direct dependencies by default, which left
    # lockfile transitives to move solely via security updates. Those bump to the
    # *minimum* version that closes the advisory they were opened for, so the pins
    # went stale the moment a broader advisory landed (brace-expansion sat at
    # 5.0.7 against an advisory covering everything through 5.0.8). Covering
    # indirect deps keeps the lockfile current through routine weekly updates
    # instead of relying on security PRs to carry it.
    allow:
      - dependency-type: all
    ignore:
      # @types/node tracks the lowest supported Node engine (20.x); never bump major.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # vitest 5 requires Node 22+ and @types/node 22+; stay on 4.x while Node 20
      # is still supported. Drop this rule along with Node 20.
      - dependency-name: 'vitest'
        update-types:
          - version-update:semver-major
    groups:
      # Batch routine production dependency bumps (minor/patch) into one PR.
      # Major bumps stay ungrouped so they get individual review.
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      # Batch routine development dependency bumps (minor/patch) into one PR.
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    # Note: groups above only apply to version-updates, so security updates are
    # intentionally left ungrouped and arrive as individual PRs to stand out.
    #
    # update-types gates on the *direct* dependency's semver jump, not on each
    # transitive's, so an indirect major rides along inside the group whenever its
    # parent moves by a minor or patch (chalk 5 -> 6 arrived this way, carried by
    # homebridge 2.1.1 -> 2.3.0). Covering indirect deps therefore does not fan
    # majors out into separate PRs: the first run under this config produced 29
    # package updates as 2 grouped PRs. Only *direct* majors arrive individually,
    # which is the intended review path for them.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
